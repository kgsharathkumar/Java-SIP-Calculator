<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP Calculator from KIT Students</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-top: 50px;
        }

        h1 {
            color: #007bff;
        }

        .container {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            background: #e9f7ef;
            border: 1px solid #28a745;
            padding: 10px;
            border-radius: 5px;
        }

        .error {
            margin-top: 15px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>💰 SIP Calculator from KIT Students</h1>

    <div class="container">
        <label for="monthlyAmount">Monthly Investment (₹):</label>
        <input type="number" id="monthlyAmount" placeholder="e.g. 5000">

        <label for="annualRate">Expected Annual Return (%):</label>
        <input type="number" id="annualRate" placeholder="e.g. 12">

        <label for="years">Investment Duration (Years):</label>
        <input type="number" id="years" placeholder="e.g. 10">

        <button onclick="calculateSIP()">Calculate</button>

        <div class="error" id="error"></div>

        <div class="result" id="result" style="display:none;">
            <p><strong>Invested Amount:</strong> ₹<span id="investedAmount"></span></p>
            <p><strong>Total Returns:</strong> ₹<span id="totalReturns"></span></p>
            <p><strong>Maturity Value:</strong> ₹<span id="maturityValue"></span></p>
        </div>
    </div>

    <script>
        async function calculateSIP() {
            const monthlyAmount = document.getElementById("monthlyAmount").value;
            const annualRate = document.getElementById("annualRate").value;
            const years = document.getElementById("years").value;
            const errorDiv = document.getElementById("error");
            const resultDiv = document.getElementById("result");

            // Reset error and result
            errorDiv.innerText = "";
            resultDiv.style.display = "none";

            // Basic validation
            if (!monthlyAmount || !annualRate || !years) {
                errorDiv.innerText = "⚠️ Please enter all three fields.";
                return;
            }

            try {
                const response = await fetch(`/api/sip/calculate?monthlyAmount=${monthlyAmount}&annualRate=${annualRate}&years=${years}`);
                if (!response.ok) {
                    throw new Error("Server error");
                }

                const data = await response.json();

                // Display result
                document.getElementById("investedAmount").innerText = data.investedAmount.toFixed(2);
                document.getElementById("totalReturns").innerText = data.totalReturns.toFixed(2);
                document.getElementById("maturityValue").innerText = data.maturityValue.toFixed(2);
                resultDiv.style.display = "block";

            } catch (error) {
                errorDiv.innerText = "❌ Failed to calculate SIP. Please try again.";
                console.error(error);
            }
        }
    </script>

</body>
</html>
